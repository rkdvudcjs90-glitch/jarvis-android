name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    outputs:
      apk-artifact: ${{ steps.apk.outputs.artifact-id }}
      test-artifact: ${{ steps.tests.outputs.artifact-id }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Bundle official Korean offline speech model
        run: python3 scripts/prepare_model.py
      - uses: actions/cache@v4
        with:
          path: .ci-signing/debug.keystore
          key: jarvis-debug-signing-v2
      - name: Prepare persistent debug signing key
        run: |
          mkdir -p .ci-signing
          if [ ! -f .ci-signing/debug.keystore ]; then
            keytool -genkeypair -keystore .ci-signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: Build, unit tests and lint
        env:
          JARVIS_DEBUG_KEYSTORE: ${{ github.workspace }}/.ci-signing/debug.keystore
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify signed APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        id: apk
        with:
          name: JARVIS-installable-debug-apk
          overwrite: true
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: tests
        with:
          name: instrumented-test-apk
          overwrite: true
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          overwrite: true
          path: app/build/reports/
          if-no-files-found: ignore

  emulator:
    outputs:
      smoke-artifact: ${{ steps.smoke.outputs.artifact-id }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.apk-artifact }}
          merge-multiple: true
          path: apk
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.test-artifact }}
          merge-multiple: true
          path: test-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell settings put secure immersive_mode_confirmations confirmed
            adb install apk/app-debug.apk
            adb install test-apk/app-debug-androidTest.apk
            adb shell am instrument -w ai.jarvis.test/ai.jarvis.SmokeInstrumentation | tee instrumentation.txt
            adb pull /sdcard/Android/data/ai.jarvis/files/smoke/ screenshots
            adb logcat -d -b crash > crash-log.txt
            grep -q 'PASS:' instrumentation.txt
            if ! command -v ffmpeg >/dev/null; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
            ffmpeg -y -v error -framerate 5 -i screenshots/frame%02d.png -c:v libx264 -pix_fmt yuv420p -movflags +faststart design-preview.mp4
            adb logcat -d -b crash > crash-log.txt
      - uses: actions/upload-artifact@v4
        id: smoke
        if: always()
        with:
          name: emulator-smoke-results
          overwrite: true
          path: |
            instrumentation.txt
            screenshots/
            design-preview.mp4
            crash-log.txt
          if-no-files-found: ignore

  download:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.apk-artifact }}
          merge-multiple: true
          path: apk
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.emulator.outputs.smoke-artifact }}
          merge-multiple: true
          path: smoke
      - name: Publish tested preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JARVIS_RUN: ${{ github.run_number }}
          JARVIS_SHA: ${{ github.sha }}
        run: |
          cp apk/app-debug.apk JARVIS-0.5.3.apk
          sha256sum JARVIS-0.5.3.apk > SHA256SUMS.txt
          cat > release-notes.txt <<'NOTES'
          시작 버튼 없는 자동 음성 대기 0.5.3 설치 테스트 APK. 최초 마이크 권한 허용 후 앱을 열면 자동으로 자비스 호출을 기다립니다. 메인 화면의 이름·상태·대기 안내·최근 답변 글씨를 모두 설정 패널로 옮겨 구체만 표시합니다. 시스템 바는 전체 화면 모드로 숨기며 가장자리 스와이프로 일시 표시할 수 있습니다. 구체를 길게 누르면 상태·대화·설정 패널이 열립니다. 대화 후 12초 무음 또는 대기해 명령으로 호출 대기에 복귀합니다.
          CI: 컴파일, 단위 테스트, Android lint, APK 서명 및 Android 16 에뮬레이터 검증. 실제 호출 정확도, 화면 꺼짐 장시간 대기와 배터리는 Galaxy Z Flip5에서 추가 확인이 필요합니다.
          재부팅·강제 종료 뒤에는 앱을 다시 열어 주세요. 대기 종료 음성 명령이나 알림으로 마이크를 끄면 다음 앱 실행에서도 그 선택을 유지합니다. 다시 켜려면 구체를 길게 누른 패널에서 시작하세요.
          0.2 preview-4 이후와 같은 테스트 서명 키로 업데이트 설치하며 삭제는 필요하지 않습니다. 모든 앱의 완전 자동화는 구현하지 않았습니다. API 키는 앱 설정에서 직접 입력하세요.
          NOTES
          gh release create "preview-$JARVIS_RUN" JARVIS-0.5.3.apk SHA256SUMS.txt smoke/screenshots/hologram.png smoke/design-preview.mp4 --target "$JARVIS_SHA" --prerelease --title 'JARVIS 0.5.3 · 글씨 없는 구체 화면' --notes-file release-notes.txt
