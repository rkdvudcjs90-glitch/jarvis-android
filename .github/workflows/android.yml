name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Bundle official Korean offline speech model
        run: python3 scripts/prepare_model.py
      - uses: actions/cache@v4
        with:
          path: .ci-signing/debug.keystore
          key: jarvis-debug-signing-v2
      - name: Prepare persistent debug signing key
        run: |
          mkdir -p .ci-signing
          if [ ! -f .ci-signing/debug.keystore ]; then
            keytool -genkeypair -keystore .ci-signing/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
      - name: Build, unit tests and lint
        env:
          JARVIS_DEBUG_KEYSTORE: ${{ github.workspace }}/.ci-signing/debug.keystore
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify signed APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-installable-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-apk
          path: app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: app/build/reports/
          if-no-files-found: ignore

  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: JARVIS-installable-debug-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: instrumented-test-apk
          path: test-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install apk/app-debug.apk
            adb install test-apk/app-debug-androidTest.apk
            adb shell am instrument -w ai.jarvis.test/ai.jarvis.SmokeInstrumentation | tee instrumentation.txt
            grep -q 'PASS:' instrumentation.txt
            adb pull /sdcard/Android/data/ai.jarvis/files/smoke/ screenshots
            adb shell am start -W -n ai.jarvis/.MainActivity
            adb shell screenrecord --time-limit 4 /sdcard/jarvis-design-preview.mp4
            adb pull /sdcard/jarvis-design-preview.mp4 design-preview.mp4
            adb logcat -d -b crash > crash-log.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-smoke-results
          path: |
            instrumentation.txt
            screenshots/
            design-preview.mp4
            crash-log.txt
          if-no-files-found: ignore

  download:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, emulator]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: JARVIS-installable-debug-apk
          path: apk
      - uses: actions/download-artifact@v4
        with:
          name: emulator-smoke-results
          path: smoke
      - name: Publish tested preview APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          JARVIS_RUN: ${{ github.run_number }}
          JARVIS_SHA: ${{ github.sha }}
        run: |
          cp apk/app-debug.apk JARVIS-0.4.0.apk
          sha256sum JARVIS-0.4.0.apk > SHA256SUMS.txt
          cat > release-notes.txt <<'NOTES'
          확정된 청백색 입자 네트워크 구체를 적용한 상시 음성 비서 0.4 설치 테스트용 APK (debug 서명). 최초 앱에서 상시 대기를 시작하고 자비스라고 부르는 구조입니다.
          CI: Kotlin 컴파일, ROOT 명령 정책 단위 테스트, Android lint, APK 서명 검사, Android 16 에뮬레이터 시작/설정/Keystore 암호화 및 한국어 오프라인 모델 로딩·무음 디코딩 검사 통과.
          0.4의 실제 호출어 인식률·화면 꺼짐 상시 대기·음성 명령 실행·조정된 TTS는 Galaxy Z Flip5에서 미검증입니다. 모든 앱의 완전 자동화는 구현하지 않았습니다. 재부팅/강제 종료 후 수동 재시작이 필요합니다.
          이전 0.1과 서명이 달라 기존 앱 삭제 후 설치가 필요할 수 있으며 키와 이력이 삭제될 수 있습니다. API 키는 앱 설정에서 직접 입력하세요. ChatGPT 구독과 API 요금은 별개입니다.
          NOTES
          gh release create "preview-$JARVIS_RUN" JARVIS-0.4.0.apk SHA256SUMS.txt smoke/screenshots/hologram.png smoke/design-preview.mp4 --target "$JARVIS_SHA" --prerelease --title 'JARVIS 0.4.0 · Android 설치 테스트' --notes-file release-notes.txt
